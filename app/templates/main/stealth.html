<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachPrash</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0F172A;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .gate {
            text-align: center;
            max-width: 360px;
            padding: 2rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: #F59E0B;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        form { display: flex; gap: 0.5rem; }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1E293B;
            color: #E2E8F0;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
        }
        input:focus { border-color: #F59E0B; }
        button {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 8px;
            background: #F59E0B;
            color: #0F172A;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #D97706; }
        .error {
            color: #EF4444;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="gate">
        <div class="logo">CoachPrash</div>
        <p class="tagline">Coming soon. Enter access code to preview.</p>
        <form method="POST">
            <input type="text" name="code" placeholder="Access Code" autocomplete="off" autofocus>
            <button type="submit">Enter</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endwith %}
    </div>
</body>
</html>
