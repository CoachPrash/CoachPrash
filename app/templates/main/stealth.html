<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachPrash</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="stealth-body">
    <div class="stealth-gate">
        <div class="stealth-logo">CoachPrash</div>
        <p class="stealth-tagline">Coming soon. Enter access code to preview.</p>
        <form method="POST" class="stealth-form">
            <input type="text" name="code" placeholder="Access Code" autocomplete="off" autofocus class="stealth-input">
            <button type="submit" class="stealth-btn">Enter</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="stealth-error">{{ message }}</p>
            {% endfor %}
        {% endwith %}
    </div>
</body>
</html>
